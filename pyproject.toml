plot = "software_asset_management.main:plot"
run_with_trigger = "software_asset_management.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "d84e1c57-64e8-4489-9fc3-b85e10cee164"
