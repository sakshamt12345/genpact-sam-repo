[project]
name = "software_asset_management"
version = "0.1.0"
description = "Software Asset Management using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[azure-ai-inference,tools]>=1.15.18,<2.0.0",
]

[project.scripts]
kickoff = "software_asset_management.main:kickoff"
